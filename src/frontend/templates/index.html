<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YouTube Question Answering (RAG)</title>

    <!-- Bootstrap CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container py-5">
    <h2 class="mb-4 text-center">🎥 YouTube Question Answering (RAG)</h2>

    <div class="card p-4 shadow-sm">
        <div class="mb-3">
            <label class="form-label">YouTube Video ID</label>
            <input
                type="text"
                id="videoId"
                class="form-control"
                placeholder="e.g. yC36gN-rqjo"
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Question</label>
            <input
                type="text"
                id="question"
                class="form-control"
                placeholder="Ask something about the video"
            >
        </div>

        <button class="btn btn-primary w-100" onclick="askQuestion()">
            Ask Question
        </button>

        <hr>

        <h5>Answer:</h5>
        <pre id="answer" class="bg-white p-3 rounded border"></pre>
    </div>
</div>

<script>
async function askQuestion() {
    const videoId = document.getElementById("videoId").value;
    const question = document.getElementById("question").value;
    const answerBox = document.getElementById("answer");

    answerBox.innerText = "Thinking...";

    try {
        const response = await fetch("/ask", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                video_id: videoId,
                question: question
            })
        });

        const data = await response.json();

        if (data.answer) {
            answerBox.innerText = data.answer;
        } else {
            answerBox.innerText = data.error || "Something went wrong.";
        }

    } catch (err) {
        answerBox.innerText = "Server error. Please try again.";
    }
}
</script>

</body>
</html>
